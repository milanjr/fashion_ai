openapi: 3.0.3

info:
  title: Fashion AI API
  description: Local Fashion AI development API
  version: 0.1.0

servers:
  - url: http://localhost:8000

paths:

  /api/v1/hello:
    get:
      operationId: getHello
      summary: Test GET endpoint
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"

  /api/v1/echo:
    post:
      operationId: echoMessage
      summary: Test POST endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EchoRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoResponse"

components:

  schemas:

    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Hello from Fashion AI API

    EchoRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Hello Fashion AI

    EchoResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Hello Fashion AI